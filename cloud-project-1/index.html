<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Project 1 - Play against Stockfish</title>
    <!-- Vi henter stilene til sjakkbrettet -->
    <link rel="stylesheet" href="chessboard.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e2e;
            color: #cdd6f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 { margin-bottom: 10px; color: #a6e3a1; }
        #board { width: 400px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .status { margin-top: 15px; font-size: 1.1rem; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Beat the Cloud Engine</h1>
    <p>Prosjekt 1: Din personlige sjakkmakker</p>
    
    <!-- Her blir sjakkbrettet tegnet inn -->
    <div id="board"></div>
    <div class="status" id="status">Ditt trekk (Hvit)</div>

    <!-- Vi laster inn jQuery, Chess.js for regler, og Chessboard.js for brettet -->
    <script src="jquery.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="chessboard.min.js"></script>

        <script>
        var board = null;
        var game = new Chess();
        var $status = $('#status');

        // Vi oppretter en kobling til en Stockfish sjakkmotor i skyen/nettleseren
        var stockfish = new Worker('stockfish.js');

        // Konfigurer Stockfish til å spille på et lavere nivå (Skill Level 0-20)
        // Level 3-5 gir en fin og overkommelig utfordring for trening!
        stockfish.postMessage('uci');
        stockfish.postMessage('setoption name Skill Level value 5');

        function onDragStart (source, piece, position, orientation) {
            // Ikke la spilleren flytte brikker hvis spillet er over
            if (game.game_over()) return false;

            // Bare tillat å flytte hvite brikker
            if (piece.search(/^b/) !== -1) return false;
        }

        function makeComputerMove () {
            if (game.game_over()) return;

            // Send gjeldende brettposisjon til Stockfish
            stockfish.postMessage('position startpos moves ' + game.history({ verbose: true }).map(m => m.from + m.to + (m.promotion || '')).join(' '));
            
            // Fortell Stockfish at den skal kalkulere et trekk (vi begrenser søkedybden til 5 trekk for lavere nivå)
            stockfish.postMessage('go depth 5');
        }

        // Hør etter svar fra Stockfish-motoren
        stockfish.onmessage = function(event) {
            var line = event.data;
            if (line.indexOf('bestmove') > -1) {
                var moveStr = line.split(' ')[1];
                
                // Gjør trekket i spillmotoren
                var move = game.move({
                    from: moveStr.substring(0, 2),
                    to: moveStr.substring(2, 4),
                    promotion: moveStr.substring(4, 5) || undefined
                });

                // Oppdater det visuelle brettet
                board.position(game.fen());
                updateStatus();
            }
        };

        function onDrop (source, target) {
            // Sjekk om trekket er lovlig
            var move = game.move({
                from: source,
                to: target,
                promotion: 'q' // Alltid promoter til dronning for enkelhets skyld
            });

            // Ulovlig trekk
            if (move === null) return 'snapback';

            updateStatus();
            
            // Start datamaskinens tenkeprosess etter 250ms
            window.setTimeout(makeComputerMove, 250);
        }

        function onSnapEnd () {
            board.position(game.fen());
        }

        function updateStatus () {
            var status = '';
            var moveColor = (game.turn() === 'b') ? 'Svart (Stockfish)' : 'Hvit (Deg)';

            if (game.in_checkmate()) {
                status = 'Spillet er over. ' + moveColor + ' er i sjakk matt!';
            } else if (game.in_draw()) {
                status = 'Spillet er over. Remis (uavgjort).';
            } else {
                status = moveColor + ' sitt trekk.';
                if (game.in_check()) {
                    status += ' (Sjakk!)';
                }
            }
            $status.html(status);
        }

        var config = {
            draggable: true,
            position: 'start',
            onDragStart: onDragStart,
            onDrop: onDrop,
            onSnapEnd: onSnapEnd
        };
        
        // Initialiser brettet
        board = Chessboard('board', config);
        updateStatus();
    </script>

</body>
</html>
